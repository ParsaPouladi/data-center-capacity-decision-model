<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Capacity Allocation Decision Model">
  <rect width="32" height="32" rx="6" fill="#2e5c63" />
  <!-- The model's own shape: capacity arriving in phased steps against a
       required-capacity rule. Same accent as the application's --accent. -->
  <path d="M5 25h6v-6h5v-5h5V8h6" fill="none" stroke="#ffffff" stroke-width="2.4"
        stroke-linejoin="round" stroke-linecap="round" />
  <path d="M4 11h24" fill="none" stroke="#ffffff" stroke-width="1.6"
        stroke-linecap="round" stroke-dasharray="3 3" opacity="0.65" />
</svg>
