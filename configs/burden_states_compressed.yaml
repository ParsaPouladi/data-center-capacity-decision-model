# Power-delivery burden mapping: B_i -> (tau1_bar, tau2_bar)
# SENSITIVITY VARIANT (model spec): every tranche timing scaled by 0.9
# (~10% earlier) relative to configs/burden_states.yaml (v1-baseline), same
# four states, same interpretation labels. This is a synthetic sensitivity
# device to test whether decision boundaries and strategy rankings identified
# under v1-baseline survive a plausible alternative timing assumption -- it
# is NOT a claim that this timing is more accurate than v1-baseline.
#
# Any substantive change to these values must bump mapping_version and must
# not be made silently (model spec).

mapping_version: v1-compressed

states:
  1:
    label: Low
    interpretation: Limited additional infrastructure required
    tau1_bar: 16.2
    tau2_bar: 21.6
  2:
    label: Moderate
    interpretation: Meaningful local/substation upgrades required
    tau1_bar: 21.6
    tau2_bar: 27.0
  3:
    label: High
    interpretation: Major dedicated infrastructure development
    tau1_bar: 27.0
    tau2_bar: 37.8
  4:
    label: Very high
    interpretation: Major upstream/system infrastructure dependency
    tau1_bar: 37.8
    tau2_bar: 48.6
