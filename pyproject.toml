[project]
name = "trackc"
version = "1.0.0"
description = "Data-center capacity allocation under limited information and uncertain power delivery."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "httpx>=0.28",
]
# Public-application live API layer (non-canonical). NOT quantitative-engine
# dependencies -- the engine (src/trackc/) never imports these. Kept
# optional so `pip install -e .` still builds the model with only
# numpy/pydantic/pyyaml/scipy.
app = [
    "fastapi>=0.141",
    "uvicorn>=0.52",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
